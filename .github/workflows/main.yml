# ============================================================================
# SCSG — Simple Clinic Schedule Generator
# Release workflow
# ----------------------------------------------------------------------------
# File    : .github/workflows/main.yml
#
# The repository stores the entire project as a single ZIP archive at its
# root (e.g. `simple-clinic-schedule-generator.zip`), because the upload
# interface used for this repo cannot create folders directly.
#
# This workflow:
#   1. Locates that ZIP in the repository root.
#   2. Extracts it and finds the project root by locating scsg.html.
#   3. Verifies that all required files are present inside the archive.
#   4. Builds the developer release archive.
#   5. Builds the end-user release archive (Run Me.html + HOW TO USE.txt).
#   6. Publishes both archives as a GitHub Release.
#
# Trigger: any pushed tag matching vMAJOR.MINOR.PATCH, or manual dispatch.
#
# Author  : Richard Korbla Adzido
# License : MIT (see LICENSE inside the source archive)
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0). Must match vMAJOR.MINOR.PATCH.'
        required: true
        type: string
      archive:
        description: 'Optional: explicit path to the source ZIP in the repo root. Leave empty to auto-detect.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Extract archive, build, publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve version
        id: version
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' does not match vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Locate source archive
        id: locate
        run: |
          set -e
          CANDIDATE="${{ github.event.inputs.archive }}"
          REPO_NAME="${{ github.event.repository.name }}"

          if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE" ]; then
            ZIP="$CANDIDATE"
          elif [ -f "${REPO_NAME}.zip" ]; then
            ZIP="${REPO_NAME}.zip"
          else
            ZIP=$(find . -maxdepth 1 -name '*.zip' -type f | head -n 1)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::No source ZIP found in repository root."
            echo "Upload your exported project as <repo-name>.zip or any single .zip file."
            ls -la
            exit 1
          fi

          echo "archive=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using source archive: $ZIP"

      - name: Extract source archive and locate project root
        id: extract
        run: |
          set -e
          ZIP="${{ steps.locate.outputs.archive }}"
          rm -rf work dist
          mkdir -p work

          unzip -q "$ZIP" -d work

          # Some ZIP tools (notably on Windows) store directories with mode
          # 000, which unzip faithfully reproduces. Grant owner access so
          # the CI user can descend into the tree. Capital X gives execute
          # only to directories, not to regular files.
          chmod -R u+rwX work || true

          # Strip operating-system metadata that pollutes the tree.
          rm -rf work/__MACOSX 2>/dev/null || true
          find work -type f -name '.DS_Store'   -delete 2>/dev/null || true
          find work -type f -name 'Thumbs.db'   -delete 2>/dev/null || true
          find work -type f -name 'desktop.ini' -delete 2>/dev/null || true

          # Find the project root by locating scsg.html anywhere in the tree.
          FOUND=$(find work -type f -name 'scsg.html' 2>/dev/null | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "::error::scsg.html not found inside the archive."
            echo "--- Extracted tree (max depth 4, first 80 entries) ---"
            find work -maxdepth 4 2>/dev/null | sort | head -n 80 || true
            exit 1
          fi

          ROOT=$(dirname "$FOUND")
          echo "Detected project root: $ROOT"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "--- Project tree (top 40 entries) ---"
          find "$ROOT" -maxdepth 2 2>/dev/null | sort | head -n 40 || true

      - name: Pre-flight sanity check
        run: |
          set -e
          ROOT="${{ steps.extract.outputs.root }}"

          for required in \
              scsg.html \
              assets/scsg.css \
              assets/scsg.js \
              LICENSE \
              PRIVACY.md \
              README.md; do
            if [ ! -e "$ROOT/$required" ]; then
              echo "::error::Required file missing in archive: $required (project root: $ROOT)"
              exit 1
            fi
          done

          if [ -f "$ROOT/docs/CHANGELOG.md" ]; then
            echo "CHANGELOG found at docs/CHANGELOG.md"
          elif [ -f "$ROOT/CHANGELOG.md" ]; then
            echo "CHANGELOG found at CHANGELOG.md"
          else
            echo "::error::CHANGELOG.md not found (expected at repo root or under docs/)."
            exit 1
          fi

          echo "All required files present."

      - name: Build developer archive
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          ROOT="${{ steps.extract.outputs.root }}"
          OUT_NAME="scsg-${VERSION}"

          mkdir -p "dist/${OUT_NAME}"

          rsync -a \
            --exclude='.git/' \
            --exclude='dist/' \
            --exclude='work/' \
            --exclude='__MACOSX/' \
            --exclude='backups/*.json' \
            --exclude='node_modules/' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='desktop.ini' \
            --exclude='*.zip' \
            --exclude='*.log' \
            "$ROOT/" "dist/${OUT_NAME}/"

          (cd dist && zip -r -q "${OUT_NAME}.zip" "${OUT_NAME}")
          echo "Built dist/${OUT_NAME}.zip ($(du -h dist/${OUT_NAME}.zip | cut -f1))"

      - name: Build end-user archive
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          ROOT="${{ steps.extract.outputs.root }}"
          OUT_NAME="SCSG-Clinic-Tool-${VERSION}"
          TARGET="dist/${OUT_NAME}"

          mkdir -p "${TARGET}/assets"

          cp "$ROOT/scsg.html"        "${TARGET}/Run Me.html"
          cp "$ROOT/assets/scsg.css"  "${TARGET}/assets/"
          cp "$ROOT/assets/scsg.js"   "${TARGET}/assets/"
          cp "$ROOT/LICENSE"          "${TARGET}/LICENSE.txt"
          cp "$ROOT/PRIVACY.md"       "${TARGET}/PRIVACY.txt"

          cat > "${TARGET}/HOW TO USE.txt" <<'EOF'
          SCSG — Simple Clinic Schedule Generator

          HOW TO OPEN
            1. Extract this folder (right-click the ZIP → Extract All).
            2. Double-click "Run Me.html". It opens in your web browser.
            3. That's it. No installation, no internet needed.

          FIRST TIME USE
            The app starts with placeholder staff (Nurse A, Staff A, etc.).
            1. Click "Remove All Staff".
            2. Click "Add New Staff" for each of your staff members.
            3. Pick the month and year, choose PDF or Excel.
            4. Click "Generate Schedule".

          WHERE YOUR DATA IS SAVED
            In your browser. If you clear browser history, you lose it.
            BACK UP REGULARLY:
              - Click "Export Staff Configuration"
              - Save the .json file somewhere safe

          FOR YOUR PRIVACY
            This tool runs entirely offline. Nothing is sent anywhere.
            Your staff names never leave your computer.
            See PRIVACY.txt for full details.

          LICENSE
            MIT — see LICENSE.txt.
            This distribution is for internal clinic use.
          EOF

          (cd dist && zip -r -q "${OUT_NAME}.zip" "${OUT_NAME}")
          echo "Built dist/${OUT_NAME}.zip ($(du -h dist/${OUT_NAME}.zip | cut -f1))"

      - name: Upload workflow artefacts
        uses: actions/upload-artifact@v5
        with:
          name: scsg-archives-${{ steps.version.outputs.version }}
          path: |
            dist/scsg-*.zip
            dist/SCSG-Clinic-Tool-*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: SCSG ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            **SCSG — Simple Clinic Schedule Generator**
            Version `${{ steps.version.outputs.version }}`

            ## Downloads

            | File | Who it's for |
            |---|---|
            | `scsg-${{ steps.version.outputs.version }}.zip` | **Developers & forks.** Full source, docs, license, workflow. |
            | `SCSG-Clinic-Tool-${{ steps.version.outputs.version }}.zip` | **Clinic staff.** Unzip, then double-click **Run Me.html**. |

            ## Running the tool

            1. Download `SCSG-Clinic-Tool-${{ steps.version.outputs.version }}.zip`.
            2. Extract the folder.
            3. Double-click **Run Me.html**.
            4. No installation. No internet required. Fully offline.

            ## Privacy

            SCSG runs entirely in your browser. It sends **no** data anywhere.
            See `PRIVACY.txt` inside the archive.

            ## Documentation

            The full `CHANGELOG.md`, `README.md`, and `PRIVACY.md` are
            included inside `scsg-${{ steps.version.outputs.version }}.zip`
            (see the `docs/` folder and the archive root).
          files: |
            dist/scsg-*.zip
            dist/SCSG-Clinic-Tool-*.zip
