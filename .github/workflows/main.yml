# ============================================================================
# SCSG — Simple Clinic Schedule Generator
# Release Workflow
# ----------------------------------------------------------------------------
# File    : .github/workflows/main.yml
#
# PURPOSE
#   This workflow automates the release process for SCSG. Because this
#   repository stores the entire project inside a single ZIP archive at the
#   root (to bypass upload folder restrictions), this workflow is responsible
#   for unpacking that archive, verifying its contents, building the two
#   release ZIPs, tagging the commit, and publishing the GitHub Release.
#
# TRIGGERS
#   1. Push a tag matching 'v*.*.*' (e.g., `git tag v1.0.0 && git push origin v1.0.0`)
#   2. Manual dispatch via the GitHub Actions UI (requires a version input).
#
# ARTIFACTS GENERATED
#   - scsg-vX.Y.Z.zip (Developer release: full source, docs, workflows)
#   - SCSG-Clinic-Tool-vX.Y.Z.zip (End-user release: Run Me.html, assets, docs)
#
# AUTHOR  : Richard Korbla Adzido
# LICENSE : MIT (see LICENSE inside the source archive)
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0). MUST start with "v".'
        required: true
        type: string
      archive:
        description: 'Optional: explicit path to the source ZIP in the repo root.'
        required: false
        type: string
        default: ''

# ----------------------------------------------------------------------------
# PERMISSIONS
# Required to push tags and create GitHub Releases.
# ----------------------------------------------------------------------------
permissions:
  contents: write

jobs:
  build-and-release:
    name: Extract archive, build, publish
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------------
      # 1. CHECKOUT
      # Fetch the repository so we can access the source ZIP and this workflow.
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ----------------------------------------------------------------------
      # 2. RESOLVE VERSION
      # Determine the version string from either the pushed tag or the manual
      # workflow input. Validates the format strictly to prevent bad releases.
      # ----------------------------------------------------------------------
      - name: Resolve version
        id: version
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          
          # Fallback just in case input is blank
          if [ -z "$VERSION" ]; then
            VERSION="v1.0.0"
            echo "::warning::No version input provided. Defaulting to v1.0.0"
          fi
          
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' does not match vMAJOR.MINOR.PATCH (e.g., v1.0.0)."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # ----------------------------------------------------------------------
      # 3. LOCATE ARCHIVE
      # Find the source ZIP. It looks for an explicit path (from manual input),
      # then tries `<repo-name>.zip`, then falls back to any single `.zip`.
      # ----------------------------------------------------------------------
      - name: Locate source archive
        id: locate
        run: |
          set -e
          CANDIDATE="${{ github.event.inputs.archive }}"
          REPO_NAME="${{ github.event.repository.name }}"

          if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE" ]; then
            ZIP="$CANDIDATE"
          elif [ -f "${REPO_NAME}.zip" ]; then
            ZIP="${REPO_NAME}.zip"
          else
            ZIP=$(find . -maxdepth 1 -name '*.zip' -type f | head -n 1)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::No source ZIP found in repository root."
            exit 1
          fi

          echo "archive=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using source archive: $ZIP"

      # ----------------------------------------------------------------------
      # 4. EXTRACT & LOCATE PROJECT ROOT
      # Unpacks the archive safely. Handles Windows-created ZIPs (permissions),
      # strips macOS metadata (`__MACOSX`), and dynamically finds the project
      # root by searching for `scsg.html`.
      # ----------------------------------------------------------------------
      - name: Extract source archive and locate project root
        id: extract
        run: |
          set -e
          ZIP="${{ steps.locate.outputs.archive }}"
          rm -rf work dist
          mkdir -p work

          unzip -q "$ZIP" -d work
          
          # Windows zip tools often set directories to mode 000. Fix permissions.
          chmod -R u+rwX work || true

          # Strip OS metadata that pollutes the tree.
          rm -rf work/__MACOSX 2>/dev/null || true
          find work -type f -name '.DS_Store'   -delete 2>/dev/null || true
          find work -type f -name 'Thumbs.db'   -delete 2>/dev/null || true

          # Find the project root dynamically (handles wrapper folders).
          FOUND=$(find work -type f -name 'scsg.html' 2>/dev/null | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "::error::scsg.html not found inside the archive."
            exit 1
          fi

          ROOT=$(dirname "$FOUND")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Detected project root: $ROOT"

      # ----------------------------------------------------------------------
      # 5. PRE-FLIGHT SANITY CHECK
      # Verify all essential files exist inside the extracted archive to
      # prevent publishing incomplete or corrupted releases.
      # ----------------------------------------------------------------------
      - name: Pre-flight sanity check
        run: |
          set -e
          ROOT="${{ steps.extract.outputs.root }}"

          for required in scsg.html assets/scsg.css assets/scsg.js LICENSE PRIVACY.md README.md; do
            if [ ! -e "$ROOT/$required" ]; then
              echo "::error::Required file missing in archive: $required"
              exit 1
            fi
          done
          
          if [ ! -f "$ROOT/docs/CHANGELOG.md" ] && [ ! -f "$ROOT/CHANGELOG.md" ]; then
            echo "::error::CHANGELOG.md not found."
            exit 1
          fi

      # ----------------------------------------------------------------------
      # 6. BUILD DEVELOPER ARCHIVE
      # Creates `scsg-vX.Y.Z.zip` containing the full source, docs, and
      # workflows. Injects `VERSION.txt`.
      # ----------------------------------------------------------------------
      - name: Build developer archive
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          ROOT="${{ steps.extract.outputs.root }}"
          OUT_NAME="scsg-${VERSION}"

          mkdir -p "dist/${OUT_NAME}"
          rsync -a \
            --exclude='.git/' --exclude='dist/' --exclude='work/' --exclude='__MACOSX/' \
            --exclude='backups/*.json' --exclude='node_modules/' \
            --exclude='.vscode/' --exclude='.idea/' --exclude='.DS_Store' \
            --exclude='Thumbs.db' --exclude='desktop.ini' --exclude='*.zip' --exclude='*.log' \
            "$ROOT/" "dist/${OUT_NAME}/"

          # Stamp VERSION.txt into the developer archive
          echo "SCSG ${VERSION}" > "dist/${OUT_NAME}/VERSION.txt"
          echo "https://github.com/${{ github.repository }}" >> "dist/${OUT_NAME}/VERSION.txt"

          (cd dist && zip -r -q "${OUT_NAME}.zip" "${OUT_NAME}")
          echo "Built dist/${OUT_NAME}.zip"

      # ----------------------------------------------------------------------
      # 7. BUILD END-USER ARCHIVE
      # Creates `SCSG-Clinic-Tool-vX.Y.Z.zip` containing only the files a
      # clinic staff member needs. Injects `VERSION.txt` and a customized
      # `HOW TO USE.txt`.
      # ----------------------------------------------------------------------
      - name: Build end-user archive
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          ROOT="${{ steps.extract.outputs.root }}"
          OUT_NAME="SCSG-Clinic-Tool-${VERSION}"
          TARGET="dist/${OUT_NAME}"

          mkdir -p "${TARGET}/assets"

          cp "$ROOT/scsg.html"        "${TARGET}/Run Me.html"
          cp "$ROOT/assets/scsg.css"  "${TARGET}/assets/"
          cp "$ROOT/assets/scsg.js"   "${TARGET}/assets/"
          cp "$ROOT/LICENSE"          "${TARGET}/LICENSE.txt"
          cp "$ROOT/PRIVACY.md"       "${TARGET}/PRIVACY.txt"

          # Stamp VERSION.txt into the end-user archive
          echo "SCSG ${VERSION}" > "${TARGET}/VERSION.txt"
          echo "https://github.com/${{ github.repository }}" >> "${TARGET}/VERSION.txt"

          # Write HOW TO USE.txt (Note: unquoted EOF allows ${VERSION} expansion)
          cat > "${TARGET}/HOW TO USE.txt" <<EOF
          SCSG — Simple Clinic Schedule Generator
          Version: ${VERSION}

          HOW TO OPEN
            1. Extract this folder (right-click the ZIP → Extract All).
            2. Double-click "Run Me.html". It opens in your web browser.
            3. That's it. No installation, no internet needed.

          FIRST TIME USE
            The app starts with placeholder staff (Nurse A, Staff A, etc.).
            1. Click "Remove All Staff".
            2. Click "Add New Staff" for each of your staff members.
            3. Pick the month and year, choose PDF or Excel.
            4. Click "Generate Schedule".

          WHERE YOUR DATA IS SAVED
            In your browser. If you clear browser history, you lose it.
            BACK UP REGULARLY:
              - Click "Export Staff Configuration"
              - Save the .json file somewhere safe

          FOR YOUR PRIVACY
            This tool runs entirely offline. Nothing is sent anywhere.
            See PRIVACY.txt for full details.

          LICENSE
            MIT — see LICENSE.txt.
          EOF

          (cd dist && zip -r -q "${OUT_NAME}.zip" "${OUT_NAME}")
          echo "Built dist/${OUT_NAME}.zip"

      # ----------------------------------------------------------------------
      # 8. UPLOAD ARTIFACTS
      # Saves the generated ZIPs to the GitHub Actions run (retained 30 days).
      # ----------------------------------------------------------------------
      - name: Upload workflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: scsg-archives-${{ steps.version.outputs.version }}
          path: |
            dist/scsg-*.zip
            dist/SCSG-Clinic-Tool-*.zip
          retention-days: 30
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # 9. ENSURE RELEASE TAG EXISTS
      # Crucial Fix: `softprops/action-gh-release` fails if the tag doesn't
      # exist on the repository (which happens during manual dispatch).
      # This creates and pushes the tag automatically before publishing.
      # (Note: GitHub prevents `GITHUB_TOKEN` pushes from triggering new runs).
      # ----------------------------------------------------------------------
      - name: Ensure release tag exists
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"

          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q "refs/tags/${VERSION}$"; then
            echo "Tag ${VERSION} already exists on origin."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "${VERSION}" -m "SCSG ${VERSION}"
          git push origin "${VERSION}"
          echo "Created and pushed tag ${VERSION}."

      # ----------------------------------------------------------------------
      # 10. CREATE GITHUB RELEASE
      # Publishes the release and attaches both ZIP artifacts.
      # ----------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SCSG ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            **SCSG — Simple Clinic Schedule Generator**
            Version `${{ steps.version.outputs.version }}`

            ## Downloads

            | File | Who it's for |
            |---|---|
            | `scsg-${{ steps.version.outputs.version }}.zip` | **Developers & forks.** Full source, docs, license, workflow. |
            | `SCSG-Clinic-Tool-${{ steps.version.outputs.version }}.zip` | **Clinic staff.** Unzip, then double-click **Run Me.html**. |

            ## Running the tool

            1. Download `SCSG-Clinic-Tool-${{ steps.version.outputs.version }}.zip`.
            2. Extract the folder.
            3. Double-click **Run Me.html**.
            4. No installation. No internet required. Fully offline.

            ## Privacy

            SCSG runs entirely in your browser. It sends **no** data anywhere.
            See `PRIVACY.txt` inside the archive.
          files: |
            dist/scsg-*.zip
            dist/SCSG-Clinic-Tool-*.zip
